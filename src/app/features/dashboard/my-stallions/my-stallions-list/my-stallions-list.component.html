<h3 class="subtitle is-3 has-text-weight-semibold">Liste de mes étalons</h3>

<section class="section">
    <div class="container">
        <div class="box has-text-centered stallion-box" style="border-radius: 15px; background-color: #f7faf7;" *ngFor="let i of getNumberArray(nbOfStallions)">
            <app-dashboard-stallion-box [item]="items[i]" (stallionAction)="handleDashboardStallionBoxEvent($event)"></app-dashboard-stallion-box>
        </div>
    </div>
</section>
