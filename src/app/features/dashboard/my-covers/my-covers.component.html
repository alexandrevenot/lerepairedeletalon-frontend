<h3 class="subtitle is-3 has-text-weight-semibold">{{title[coverStatus]}}</h3>

<section class="section">
    <div class="container">
        <div class="box has-text-centered" style="background-color: #f7faf7;" *ngFor="let i of getNumberArrayF(covers.length)">
        <app-cover-box [item]="covers[i]" (goToCoverPageEvent)="goToCoverPage($event)"></app-cover-box>
        </div>
    </div>
</section>
