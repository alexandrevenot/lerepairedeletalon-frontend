<div class="columns">
    <div class="column has-text-right">
        <h4 class="subtitle is-4">{{item.stallion_name}}</h4>
    </div>

    <div class="column middle-column is-1">
        
    </div>

    <div class="column has-text-left">
        <h4 class="subtitle is-4">{{item.mare_name}}</h4>
    </div>
</div>

<div class="columns is-vcentered">
    <div class="column">
        <div class="block has-text-grey mb-2">
            Statut:
        </div>
        <div class="block">
            <span class="tag is-medium" [ngClass]="statusHelperObject[item.status]">{{statusMappingObject[item.status]}}</span>
        </div>
    </div>
    <div class="column is-2">
        <div class="content has-text-centered">
            <div class="block has-text-grey mb-2">
                Revenus bruts:
            </div>
            <div class="block">
                <span class="tag is-medium has-text-weight-semibold">{{item.income}} €</span>
            </div>
        </div>
    </div>
    <div class="column">
        <div class="buttons is-centered">
            <button class="button">
                <span class="icon">
                    <i class="fas fa-eye"></i>
                </span>
                <span>
                    Consulter
                </span>
            </button>
        </div>
        <div class="buttons is-centered">
            <button class="button is-success" *ngIf="item.status === 'offered'">
                <span class="icon">
                    <i class="fas fa-check"></i>
                </span>
                <span>
                    Accepter
                </span>
            </button>

            <button class="button is-danger" *ngIf="item.status === 'offered'">
                <span class="icon">
                    <i class="fas fa-xmark"></i>
                </span>
                <span>
                    Refuser
                </span>
            </button>
        </div>
    </div>
</div>
