<div class="columns">
    <div class="column has-text-right">
        <h4 class="subtitle is-4 has-text-weight-semibold">{{item.stallion_name}}</h4>
    </div>

    <div class="column middle-column is-1">
        
    </div>

    <div class="column has-text-left">
        <h4 class="subtitle is-4 has-text-weight-semibold">{{item.mare_name}}</h4>
    </div>
</div>

<div class="columns is-vcentered">
    <div class="column">
        <div class="block has-text-grey mb-2">
            Statut:
        </div>
        <div class="block">
            <span class="tag is-medium" [ngClass]="statusHelperObject[item.status]">{{statusMappingObject[item.status]}}, {{statusCommentaryMappingObject[item.status]}}</span>
        </div>
    </div>
    <div class="column is-2">
        <div class="content has-text-centered">
            <div class="block has-text-grey mb-2">
                Revenus bruts:
            </div>
            <div class="block">
                <span class="tag is-medium has-text-weight-semibold">{{item.price}} €</span>
            </div>
        </div>
    </div>
    <div class="column">
        <div class="buttons is-centered" (click)="goToCoverPage(item.id)">
            <button class="button">
                <span class="icon">
                    <i class="fas fa-eye"></i>
                </span>
                <span>
                    Gérer / Consulter les détails
                </span>
            </button>
        </div>
    </div>
</div>
