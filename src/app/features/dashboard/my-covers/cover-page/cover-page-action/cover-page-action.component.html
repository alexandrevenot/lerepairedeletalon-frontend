<h3 class="subtitle is-3 has-text-weight-semibold">{{coverActionType == 'signature' ? 'Signature du contrat de saillie': paymentTitle}}</h3>

<iframe title="Signature du du contrat de saillie" [src]="iframe_url" [style]="'width: 100%; height: ' + nativeHeight + 'px;'"
*ngIf="coverActionType == 'signature' && iframe_url"></iframe>

<section class="section" *ngIf="coverActionType == 'payment'">
    <div class="container">
        <div id="checkout"></div>
    </div>
</section>
