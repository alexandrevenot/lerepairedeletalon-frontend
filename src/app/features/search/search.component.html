<div class="columns">
    <div class="column is-offset-1">
        <h3 class="title is-3 has-text-weight-bold">Étalons disponibles à la saillie</h3>
    </div>
</div>

<div class="columns">
    <div class="column is-3 is-offset-1">
        <div class="columns pt-5">
            <div class="column is-offset-1">
                <app-filters [loadingStatus]="filtersAreLoading" (updateFiltersEvent)="handleNewFilters($event)"></app-filters>
            </div>
        </div>
    </div>

    <div class="column is-offset-1">
        <app-stallion-panel
        [filters]="currentFilters"
        (loadingEndingEvent)="handleLoadingEnding()"
        ></app-stallion-panel>
    </div>
    <div class="column is-1">

    </div>
</div>
