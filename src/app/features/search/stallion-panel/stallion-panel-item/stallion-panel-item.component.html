<div class="card-image is-clickable" (click)="handleClick()">
    <figure class="image is-square">
      <img [src]="item.photo">
    </figure>
</div>
<div class="card-content px-0">
    <div class="columns">
        <div class="column">
            <p class="title is-5 has-text-weight-bold">{{ item.name }}</p>
        </div>
        <div class="column is-1">
            <div class="is-pulled-right">
                <span class="icon is-small">
                  <i class="far fa-heart"></i>
                </span>
            </div>
        </div>
    </div>
    <div class="columns">
        <div class="column">
            <div class="icon-text">
                <span class="icon has-text-info">
                  <i class="fa-solid fa-location-dot" style="color:hsl(0, 0%, 71%)"></i>
                </span>
                <span class="subtitle is-6 has-text-left has-text-grey-light">
                    {{ item.location }}
                </span>
              </div>
        </div>
        <div class="column is-3">
            <p class="subtitle is-6 has-text-right has-text-weight-bold"> {{ item.price }}€ </p>
        </div>
    </div>
</div>
