<div class="grid" *ngFor="let row of getNumberArrayF(items.length/3)">
    <div class="cell" *ngFor="let col of [0,1,2]">
        <article class="card is-shadowless" [ngClass]="!items[row*3+col] ? 'is-invisible' : ''">
            <app-stallion-panel-item
                [item]="items[row*3+col]? items[row*3+col] : this.emptyItem"
                [isFavorite]="items[row*3+col]? isAFavoriteStallion(items[row*3+col]): false"
                (updateFavoriteStallionEvent)="updateFavoriteStallion($event)">
            </app-stallion-panel-item>
        </article>
    </div>
</div>

<div *ngIf="isLoading" class="loading-indicator has-text-centered">
    <span class="icon is-large" style="color:hsl(0, 0%, 71%)">
        <i class="fas fa-spinner fa-pulse"></i>
    </span>
</div>
