<app-navbar></app-navbar>
<div class="columns">
  <div class="column is-one-third is-offset-one-third">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <h1 class="title mb-6">Créer un compte</h1>

      <div class="columns">
        <div class="column">
          <div class="field">
            <label class="label">Prénom</label>
            <div class="control has-icons-left">
              <input class="input" type="text" placeholder="" formControlName="firstname">
              <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
              </span>
            </div>
          </div>
        </div>
        <div class="column">
          <div class="field">
            <label class="label">Nom</label>
            <div class="control has-icons-left">
              <input class="input" type="text" placeholder="" formControlName="lastname">
              <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
              </span>
            </div>
          </div>
        </div>
      </div>

      <div class="columns">
        <div class="column">
          <div class="field">
            <label class="label">Email</label>
            <div class="control has-icons-left">
              <input class="input" type="text" formControlName="email">
              <span class="icon is-small is-left">
                <i class="fas fa-envelope"></i>
              </span>
            </div>
          </div>
        </div>
        <div class="column">
          <div class="field">
            <label class="label">Numéro de téléphone</label>
            <div class="control has-icons-left">
              <input class="input" type="text" placeholder="" formControlName="phoneNumber">
              <span class="icon is-small is-left">
                <i class="fas fa-phone"></i>
              </span>
            </div>
          </div>
        </div>
      </div>



      <div class="field">
        <label class="label">Mot de passe</label>
        <div class="control has-icons-left">
          <input class="input" type="password" placeholder="" formControlName="password">
          <span class="icon is-small is-left">
            <i class="fas fa-key"></i>
          </span>
        </div>
      </div>

      <div class="field">
        <div class="control">
          <button class="button is-primary" type="submit" [ngClass]="buttonIsClicked.status ? 'is-loading' : ''">Créer un compte</button>
        </div>
      </div>
      <p class="help">{{ message.value }}</p>
    </form>
  </div>
</div>
