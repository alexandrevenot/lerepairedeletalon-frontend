<section class="section">
  <nav class="navbar is-fixed-top px-5" role="navigation" aria-label="main navigation" >
    <div class="navbar-brand">
      <a class="navbar-item" routerLink="/search">
        <img src="./assets/logo/logo-black.png" width="280" height="70">
      </a>

    </div>

    <div class="navbar-menu">

      <div class="navbar-end">
        <a class="navbar-item is-size-6" routerLink="/search">
          <span class="icon-text">
            <span class="icon">
              <i class="fas fa-search"></i>
            </span>
            <span>Rechercher un étalon</span>
          </span>
        </a>

        <a class="navbar-item is-size-6" routerLink="/dashboard" *ngIf="userIsLoggedIn">
          <span class="icon-text">
            <span class="icon">
              <i class="fas fa-desktop"></i>
            </span>
            <span>Tableau de bord</span>
          </span>
        </a>

        <a class="navbar-item" *ngIf="userIsLoggedIn">
          <span class="icon-text has-text-weight-semibold">
            <span class="icon">
              <i class="fas fa-user"></i>
            </span>
            <span>Bienvenue, {{firstname}} {{lastname}}</span>
          </span>
        </a>
      
        <div class="navbar-item" *ngIf="!userIsLoggedIn">
          <div class="buttons">
            <a class="button is-primary" routerLink="/register">
              <strong>Créer un compte</strong>
            </a>
            <a class="button is-light" routerLink="/login">
              Se connecter
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>
</section>
