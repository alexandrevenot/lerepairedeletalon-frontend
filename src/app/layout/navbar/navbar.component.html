<section class="section">
  <nav class="navbar is-fixed-top px-5" role="navigation" aria-label="main navigation" >
    <div class="navbar-brand">
      <a class="navbar-item" (click)="navigateTo('rechercher-un-etalon', true)">
        <img [src]="objectStorageBaseUrl + photosPrefix + '/logo-black.png'" width="260" height="65">
      </a>

      <a role="button" class="navbar-burger" [ngClass]="burgerMenuIsActive? 'is-active': ''" aria-label="menu" aria-expanded="false" (click)="swapBurgerMenuActivation()">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div class="navbar-menu" [ngClass]="burgerMenuIsActive? 'is-active': ''" id="navMenu">

      <div class="navbar-end">
        <a class="navbar-item is-size-6" (click)="navigateTo('fonctionnement-du-site', false)">
          <span class="icon-text">
            <span class="icon">
              <img [src]="objectStorageBaseUrl + photosPrefix + '/question-mark.png'">
            </span>
            <span>Fonctionnement du site</span>
          </span>
        </a>

        <a class="navbar-item is-size-6" (click)="navigateTo('contact', false)">
          <span class="icon-text">
            <span class="icon">
              <img [src]="objectStorageBaseUrl + photosPrefix + '/contact.png'">
            </span>
            <span>Contact</span>
          </span>
        </a>

        <a class="navbar-item is-size-6" (click)="navigateTo('rechercher-un-etalon', false)">
          <span class="icon-text">
            <span class="icon">
              <img [src]="objectStorageBaseUrl + photosPrefix + '/glass.png'">
            </span>
            <span>Rechercher un étalon</span>
          </span>
        </a>

        <a class="navbar-item is-size-6" (click)="navigateTo('tableau-de-bord', true)" *ngIf="userIsLoggedIn">
          <span class="icon-text">
            <span class="icon">
              <img [src]="objectStorageBaseUrl + photosPrefix + '/monitor.png'">
            </span>
            <span>Tableau de bord</span>
          </span>
        </a>

        <a class="navbar-item is-not-clickable" *ngIf="userIsLoggedIn">
          <span class="icon-text has-text-weight-semibold">
            <span class="icon pr-1">
              <img [src]="objectStorageBaseUrl + photosPrefix + '/user.png'">
            </span>
            <span>Bonjour, {{firstname}} {{lastname}}</span>
          </span>
        </a>
      
        <div class="navbar-item" *ngIf="!userIsLoggedIn">
          <div class="buttons">
            <a class="button is-primary" (click)="navigateTo('inscription', false)">
              <strong>Créer un compte</strong>
            </a>
            <a class="button is-light" (click)="navigateTo('connexion', false)">
              Se connecter
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>
</section>
